set -g mouse on

# Wheel policy, shared by local, SSH, and nested tmux (the outermost configured
# tmux receives the wheel and applies it):
# - Full-screen TUIs that draw on the alternate screen AND request mouse input
#   (Codex, vim, less) keep their content outside tmux history, so the wheel
#   is forwarded to them and they scroll their own view.
# - Everything else, including inline TUIs such as Claude Code, enters tmux
#   copy mode so the wheel means scrollback instead of becoming Up/Down
#   prompt-history keys. Keyboard Up/Down always remain application input.
# pane_in_mode keeps forwarding for non-copy modes (e.g. choose-tree).
bind-key -T root WheelUpPane \
  if-shell -F "#{||:#{pane_in_mode},#{&&:#{alternate_on},#{mouse_any_flag}}}" \
    "send-keys -M" \
    "copy-mode -e"

set -g pane-border-status top
set -g pane-border-format " #T "

# 避免從 Claude/Codex 等 CLI 啟動 tmux server 時，NO_COLOR 污染後續 pane。
set-environment -g -u NO_COLOR
set-environment -g COLORTERM truecolor
set -as terminal-features ',xterm-256color:RGB'

# 滑鼠拖曳結束時自動複製選取內容到系統剪貼簿
# 依作業系統判斷：macOS 用 pbcopy，Linux 用 xclip
if-shell 'test "$(uname)" = "Darwin"' \
  'bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'
