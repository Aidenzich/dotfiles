set -g mouse on

# Keep wheel semantics stable across local, SSH, nested tmux, and mouse-aware
# TUIs such as Claude Code. tmux normally forwards WheelUpPane to an app when
# it detects mouse or alternate-screen mode; always enter copy mode instead so
# the wheel means scrollback while Up/Down remain ordinary application keys.
# The outermost configured tmux wins in a nested setup; when there is no local
# tmux, the remote tmux applies the exact same rule.
bind-key -T root WheelUpPane copy-mode -e

set -g pane-border-status top
set -g pane-border-format " #T "

# 避免從 Claude/Codex 等 CLI 啟動 tmux server 時，NO_COLOR 污染後續 pane。
set-environment -g -u NO_COLOR
set-environment -g COLORTERM truecolor
set -as terminal-features ',xterm-256color:RGB'

# 滑鼠拖曳結束時自動複製選取內容到系統剪貼簿
# 依作業系統判斷：macOS 用 pbcopy，Linux 用 xclip
if-shell 'test "$(uname)" = "Darwin"' \
  'bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'
